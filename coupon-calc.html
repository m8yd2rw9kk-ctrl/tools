// ---------- 存储 ----------
function lsGet(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return fallback;
    var parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : fallback;
  } catch (e) { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function loadCoupons() { return lsGet("jqcalc/coupons/v2", DEFAULT_COUPONS); }
function loadDishes()  { return lsGet("jqcalc/dishes/v1", DEFAULT_DISHES); }
function newId() { return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8); }

// ---------- 工具 ----------
function round2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return "--";
  var v = round2(n);
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, "");
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ---------- 计算 ----------
function calcChannel(coupon, ctx) {
  var available = true, reason = "";
  if (coupon.avail === "lunch" && !ctx.isLunch) { available = false; reason = "仅午市可用"; }
  if (coupon.avail === "wed" && !ctx.isWednesday) { available = false; reason = "仅周三可用"; }
  if (coupon.type === "discount") {
    var rate = Number(coupon.rate) || 100;
    return { coupon: coupon, available: available, reason: reason, count: 0, total: round2(ctx.eligible * rate / 100 + ctx.excluded) };
  }
  var face = Number(coupon.face) || 0, pay = Number(coupon.pay) || 0;
  if (ctx.eligible < face) {
    return { coupon: coupon, available: false, reason: reason || ("满" + fmt(face) + "元才能用"), count: 0, total: null };
  }
  var count = pay >= face ? 0 : (ctx.stack ? Math.floor(ctx.eligible / face) : 1);
  var total = round2(count * pay + (ctx.eligible - count * face) + ctx.excluded);
  return { coupon: coupon, available: available, reason: reason, count: count, total: total };
}
function rankChannels(coupons, ctx) {
  var rows = coupons.map(function (c) { return calcChannel(c, ctx); });
  var usable = rows.filter(function (r) { return r.available; });
  var others = rows.filter(function (r) { return !r.available; });
  usable.sort(function (a, b) { return a.total - b.total; });
  var best = usable.length ? usable[0].total : null;
  usable = usable.map(function (r) { r.isBest = r.total === best; return r; });
  return usable.concat(others);
}

  catFilter: "全部",
  couponModal: null,   // null | {editingId, form}
  dishModal: null
};

var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
var EXCLUDED_HINT = "酒水饮料、锅底蘸料、小吃甜品、龙虾烧烤、飞饼均不可用券";

function totals() {
  var all = 0, usable = 0, picked = false;
  state.dishes.forEach(function (d) {
    var q = state.qty[d.id] || 0;
    if (!q) return;
    picked = true;
    var sum = round2(q * Number(d.price || 0));
    all += sum;
    if (d.usable) usable += sum;
  });
  return { all: round2(all), usable: round2(usable), excluded: round2(all - usable), picked: picked };
}

function ctx() {
  var t = totals();
  var eligible, excluded, grand, hasInput;
  if (state.mode === "total") {
    eligible = Math.max(0, round2(Number(state.totalInput || 0) - Number(state.excludedInput || 0)));
    excluded = round2(Number(state.excludedInput || 0));
    grand = round2(Number(state.totalInput || 0));
    hasInput = Number(state.totalInput) > 0;
  } else {
    eligible = t.usable; excluded = t.excluded; grand = t.all; hasInput = t.picked;
  }
  return {
    eligible: eligible, excluded: excluded, grand: grand, hasInput: hasInput,
    isWednesday: state.dayIdx === 3, isLunch: state.isLunch, stack: state.stack
  };
}

// ---------- 渲染 ----------
var app = document.getElementById("app");
var navEl = document.getElementById("nav");
var modalEl = document.getElementById("modal");

function render() {
  renderNav();
  modalEl.innerHTML = state.couponModal ? renderCouponModal() : (state.dishModal ? renderDishModal() : "");
  if (state.tab === "calc") app.innerHTML = renderCalc();
  else if (state.tab === "coupons") app.innerHTML = renderCoupons();
  else app.innerHTML = renderDishes();
  window.scrollTo(0, 0);
}

function renderNav() {
  var items = [
    ["calc", "🧮", "算账"],
    ["coupons", "🎫", "券规则"],
    ["dishes", "🍽️", "菜品"]
  ];
  navEl.innerHTML = items.map(function (it) {
    return '<button class="' + (state.tab === it[0] ? "on" : "") + '" onclick="go(\'' + it[0] + '\')"><span class="ico">' + it[1] + '</span>' + it[2] + '</button>';
  }).join("");
}

function calcResultsHTML() {
  var c = ctx();
  var h = "";
  if (c.hasInput) {
    var hasDiscount = state.coupons.some(function (x) { return x.type === "discount"; });
    var rows = rankChannels(state.coupons, c);
    h += '<h2 class="sec" style="margin-top:16px">各渠道应付对比</h2>';
    h += '<div class="card"><div class="flex-between"><span style="color:#4b5563">不用券（原价）</span><span class="price">￥' + fmt(c.grand) + '</span></div></div>';
    rows.forEach(function (r) {
      var cls = "card result" + (r.available ? (r.isBest ? " best" : "") : " off");
      var desc;
      if (!r.available) desc = esc(r.reason);
      else if (r.coupon.type === "discount") desc = "可用券菜品￥" + fmt(c.eligible) + " 打" + fmt(r.coupon.rate) + "折";
      else desc = "用" + r.count + "张 · ￥" + fmt(r.coupon.pay) + "代￥" + fmt(r.coupon.face);
      h += '<div class="' + cls + '"><div class="result-top"><div>';
      h += '<div><span class="ch-badge">' + esc(r.coupon.channel) + '</span> <b style="font-size:14px">' + esc(r.coupon.name) + '</b>';
      if (r.available && r.isBest) h += '<span class="best-badge">最优惠</span>';
      h += '</div>';
      h += '<div class="hint" style="margin-top:4px">' + desc + '</div>';
      h += '</div><div><div class="price">￥' + fmt(r.total) + '</div>';
      if (r.available && c.grand - r.total > 0) h += '<div class="save">省￥' + fmt(c.grand - r.total) + '</div>';
      h += '</div></div></div>';
    });
    h += '<p class="hint" style="padding:0 4px">' + (c.eligible < 100 && !hasDiscount
      ? "可用券部分不足100元，代金券达不到使用门槛（折扣不受门槛限制）。"
      : "本次可用券金额￥" + fmt(c.eligible) + "，不可用券部分￥" + fmt(c.excluded) + "需原价支付。") + '</p>';
  } else {
    h += '<div class="empty" style="margin-top:8px">' + (state.mode === "total" ? "输入账单总金额后，这里会自动算出最优惠的用券方式" : "点选菜品后，这里会自动算出最优惠的用券方式") + '</div>';
  }
  return h;
}

  var c = ctx();

  h += '<div class="header"><div class="logo">¥</div><div><h1>代金券算账</h1><p>输入金额，看看哪个渠道用券最划算</p></div></div>';

    var t = totals();
    h += '<div class="card">';

    var catNames = CATEGORY_DEFAULTS.map(function (x) { return x.name; });
    var map = {};
    catNames.forEach(function (n) { map[n] = []; });
    state.dishes.forEach(function (d) {
      if (d.off) return;
      if (!map[d.cat]) map[d.cat] = [];
      map[d.cat].push(d);
    });
    catNames.forEach(function (cat) {
      var list = map[cat];

      var catDef = CATEGORY_DEFAULTS.filter(function (x) { return x.name === cat; })[0];

// ---------- 事件 ----------
window.go = function (tab) { state.tab = tab; render(); };
window.setDay = function (v) { state.dayIdx = Number(v); render(); };
window.setLunch = function (v) { state.isLunch = v; render(); };
window.setStack = function (v) { state.stack = v; render(); };
window.setMode = function (m) { state.mode = m; render(); };
function updateResults() {
  var el = document.getElementById("calc-results");
  if (el) el.innerHTML = calcResultsHTML();
}
window.setTotal = function (v) { state.totalInput = v; updateResults(); };
window.setExcluded = function (v) { state.excludedInput = v; updateResults(); };
window.chgQty = function (arg) {
  var parts = arg.split(",");
  var id = parts[0], delta = Number(parts[1]);
  var v = (state.qty[id] || 0) + delta;
  if (v <= 0) delete state.qty[id]; else state.qty[id] = v;
  render();
};
window.setKeyword = function (v) { state.keyword = v; render(); };
window.setCatFilter = function (v) { state.catFilter = v; render(); };
window.closeModal = function () { state.couponModal = null; state.dishModal = null; render(); };

window.openCouponAdd = function () {
  state.couponModal = { editingId: null, form: { name: "", channel: "美团线上", type: "voucher", pay: "", face: 100, rate: "", avail: "all", note: "" } };
  render();
};
window.openCouponEdit = function (id) {
  var cp = state.coupons.filter(function (c) { return c.id === id; })[0];
  if (!cp) return;
  state.couponModal = { editingId: id, form: JSON.parse(JSON.stringify(cp)) };
  render();
};
window.cfSet = function (k, v) { state.couponModal.form[k] = v; };
window.cfSetRender = function (k, v) { state.couponModal.form[k] = v; render(); };
window.saveCoupon = function () {
  var m = state.couponModal, f = m.form;
  f.name = (f.name || "").trim();
  if (!f.name) { alert("请填写名称"); return; }
  if (f.type === "discount") {
    var rate = Number(f.rate);
    if (!rate || rate <= 0 || rate >= 100) { alert("折扣请填 1-99 之间的数字，例如 68 表示打68折"); return; }
    f.rate = rate;
  } else {
    var pay = Number(f.pay), face = Number(f.face);
    if (!pay || !face) { alert("请填写券价和面值"); return; }
    f.pay = pay; f.face = face;
  }
  if (m.editingId) {
    state.coupons = state.coupons.map(function (c) { return c.id === m.editingId ? Object.assign({}, c, f) : c; });
  } else {
    f.id = newId();
    state.coupons = state.coupons.concat([f]);
  }
  lsSet("jqcalc/coupons/v2", state.coupons);
  state.couponModal = null;
  state.tab = "coupons";
  render();
};
window.delCoupon = function (id) {
  if (!confirm("确定删除这条券规则？")) return;
  state.coupons = state.coupons.filter(function (c) { return c.id !== id; });
  lsSet("jqcalc/coupons/v2", state.coupons);
  render();
};
window.resetCoupons = function () {
  if (!confirm("恢复为默认的3条券规则？当前自定义规则会被覆盖。")) return;
  state.coupons = JSON.parse(JSON.stringify(DEFAULT_COUPONS));
  lsSet("jqcalc/coupons/v2", state.coupons);
  render();
};

window.openDishAdd = function () {
  state.dishModal = { editingId: null, form: { name: "", cat: state.catFilter === "全部" ? CATEGORY_DEFAULTS[0].name : state.catFilter, price: "", unit: "份", tag: "", usable: true, off: false } };
  render();
};
window.openDishEdit = function (id) {
  var d = state.dishes.filter(function (x) { return x.id === id; })[0];
  if (!d) return;
  state.dishModal = { editingId: id, form: JSON.parse(JSON.stringify(d)) };
  render();
};
window.dfSet = function (k, v) { state.dishModal.form[k] = v; };
window.saveDish = function () {
  var m = state.dishModal, f = m.form;
  var price = Number(f.price);
  if (!f.name.trim() || isNaN(price)) { alert("请填写菜名和价格"); return; }
  f.name = f.name.trim(); f.price = price;
  if (m.editingId) {
    state.dishes = state.dishes.map(function (d) { return d.id === m.editingId ? Object.assign({}, d, f) : d; });
  } else {
    f.id = newId();
    state.dishes = [f].concat(state.dishes);
  }
  lsSet("jqcalc/dishes/v1", state.dishes);
  state.dishModal = null;
  state.tab = "dishes";
  render();
};
window.delDish = function (id) {
  if (!confirm("确定删除这个菜品？")) return;
  state.dishes = state.dishes.filter(function (d) { return d.id !== id; });
  lsSet("jqcalc/dishes/v1", state.dishes);
  render();
};
window.toggleDish = function (id, key) {
  state.dishes = state.dishes.map(function (d) { if (d.id === id) { var n = Object.assign({}, d); n[key] = !n[key]; return n; } return d; });
  lsSet("jqcalc/dishes/v1", state.dishes);
  render();
};
window.resetDishes = function () {
  if (!confirm("恢复为按门店截图整理的默认菜品？你新增或修改过的菜品会被覆盖。")) return;
  state.dishes = JSON.parse(JSON.stringify(DEFAULT_DISHES));
  lsSet("jqcalc/dishes/v1", state.dishes);
  render();
};

render();
</script>
</body>
</html>
